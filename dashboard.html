<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - YORDY Finance</title>

<style>
body{
    background:#08080d;
    font-family:Arial,sans-serif;
    color:white;
    margin:0;
}

header{
    background:#13131d;
    padding:20px;
    text-align:center;
    color:#8b5cf6;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#13131d;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

.valor{
    font-size:30px;
    margin-top:15px;
    color:#8b5cf6;
}
</style>
</head>

<body>

<header>
<h1>Dashboard Financeiro</h1>
</header>

<div class="cards">

<div class="card">
<h2>Saldo Atual</h2>
<div class="valor">R$ 0,00</div>
</div>

<div class="card">
<h2>Receitas</h2>
<div class="valor">R$ 0,00</div>
</div>

<div class="card">
<h2>Despesas</h2>
<div class="valor">R$ 0,00</div>
</div>

<div class="card">
<h2>Metas</h2>
<div class="valor">0%</div>
</div>

</div>

</body>
</html>
