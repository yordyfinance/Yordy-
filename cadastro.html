<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - YORDY Finance</title>

<style>
body{
    background:#08080d;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#13131d;
    width:90%;
    max-width:450px;
    padding:40px;
    border-radius:20px;
    color:white;
}

h1{
    text-align:center;
    color:#8b5cf6;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#1e1e2d;
    color:white;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">

<h1>Criar Conta</h1>

<input type="text" placeholder="Nome completo">
<input type="email" placeholder="Seu e-mail">
<input type="password" placeholder="Criar senha">
<input type="password" placeholder="Confirmar senha">

<button>Criar Conta</button>

</div>

</body>
</html>
